<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión · Coin Collector</title>
  <link rel="stylesheet" href="style.css">
  <script src="config.js"></script>
</head>
<body>
  <main class="center">
    <div class="card">
      <h1>Coin Collector</h1>
      <p class="sub">Inicia sesión para jugar y guardar tu puntaje.</p>

      <div class="tabs">
        <button type="button" id="tabLogin" class="active">Iniciar sesión</button>
        <button type="button" id="tabRegister">Registrarse</button>
      </div>

      <form id="form" autocomplete="on">
        <label for="name">Usuario</label>
        <input id="name" name="name" required autocomplete="username">

        <label for="password">Contraseña</label>
        <input id="password" name="password" type="password" required autocomplete="current-password">

        <button class="btn" id="submit" type="submit">Entrar</button>
        <p class="msg" id="msg" role="status"></p>
      </form>
    </div>
  </main>

  <script>
    let mode = 'login'; // 'login' | 'register'
    const $ = (id) => document.getElementById(id);

    function setMode(m) {
      mode = m;
      $('tabLogin').classList.toggle('active', m === 'login');
      $('tabRegister').classList.toggle('active', m === 'register');
      $('submit').textContent = m === 'login' ? 'Entrar' : 'Crear cuenta';
      $('password').autocomplete = m === 'login' ? 'current-password' : 'new-password';
      showMsg('');
    }
    function showMsg(text, type = 'error') {
      $('msg').textContent = text;
      $('msg').className = 'msg ' + type;
    }

    $('tabLogin').onclick = () => setMode('login');
    $('tabRegister').onclick = () => setMode('register');

    $('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const body = { name: $('name').value.trim(), password: $('password').value };
      $('submit').disabled = true;
      try {
        const res = await fetch(`${API_URL}/auth/${mode}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Error');

        // >>> Aquí se obtiene el ID del usuario al iniciar sesión <<<
        const userId = data.id;
        sessionStorage.setItem('user_id', userId);
        sessionStorage.setItem('user_name', data.name);

        showMsg(`Bienvenido, ${data.name}`, 'ok');
        // Se pasa el ID en la URL a la página del videojuego
        location.href = `game.html?user_id=${encodeURIComponent(userId)}`;
      } catch (err) {
        showMsg(err.message === 'Failed to fetch'
          ? 'No se pudo conectar con la API. ¿Está corriendo en ' + API_URL + '?'
          : err.message);
      } finally {
        $('submit').disabled = false;
      }
    });
  </script>
</body>
</html>
